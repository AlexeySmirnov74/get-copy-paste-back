name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile, run synthetic checks and package
        shell: powershell
        run: |
          & .\scripts\Package-Release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish verified tag
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          $manifest = Get-Content -LiteralPath ('.\build\release-'+$version+'.json') -Raw | ConvertFrom-Json
          if ($manifest.Version -ne $version) { throw 'Tag and application versions disagree' }
          $notes = '.\docs\releases\'+$version+'.md'
          if (!(Test-Path -LiteralPath $notes)) { throw 'Bilingual release notes are required' }
          & gh release create $env:GITHUB_REF_NAME @($manifest.Assets) --repo $env:GITHUB_REPOSITORY --verify-tag --title ('Get Copy-Paste Back '+$version) --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect whether the tag already has a release before retrying' }
      - name: Show build failure details
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem -LiteralPath .\build -Filter 'validation-*.txt' -File -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 120 }
