<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Передача файла 1 МБ в удалённую Windows примерно за 15 секунд</title>
  <desc id="desc">Пример: файл 1 МБ передаётся с вашего ПК в удалённую Windows через видео камеры примерно за 15 секунд при измеренной скорости 0,557 Мбит/с. Используется режим 1080p с четырьмя цветами и ячейками 4 пикселя. Время зависит от подключения; подготовка и подтверждение могут увеличить его.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #223322; }
      .heading { font-size: 34px; font-weight: 700; }
      .intro { font-size: 24px; fill: #4b6044; }
      .label { font-size: 29px; font-weight: 700; text-anchor: middle; }
      .small { font-size: 22px; fill: #4b6044; text-anchor: middle; }
      .time { font-size: 38px; font-weight: 700; fill: #326b08; text-anchor: middle; }
    </style>
  </defs>
  <rect width="960" height="460" rx="24" fill="#f6faf3"/>
  <rect x="40" y="35" width="7" height="35" rx="3" fill="#60b515"/>
  <text class="heading" x="62" y="64">Файл 1 МБ — около 15 секунд.</text>
  <text class="intro" x="40" y="108">С вашего ПК в удалённый рабочий стол.</text>

  <rect x="40" y="143" width="250" height="216" rx="20" fill="#fff" stroke="#d9e7d2" stroke-width="2"/>
  <rect x="670" y="143" width="250" height="216" rx="20" fill="#fff" stroke="#d9e7d2" stroke-width="2"/>

  <g stroke="#326b08" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M137 174h39l23 23v65h-62z" fill="#f0f7ea"/>
    <path d="M176 174v23h23" fill="#eaf4e1"/>
    <path d="M151 222h34m-34 13h34m-34 13h22" fill="none" stroke="#60b515"/>
  </g>
  <text class="label" x="165" y="302">Файл 1 МБ</text>
  <text class="small" x="165" y="336">Ваш ПК</text>

  <g fill="none" stroke="#326b08" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="737" y="181" width="116" height="75" rx="7" fill="#f0f7ea"/>
    <path d="M738 244h114m-57 12v15m-18 0h36"/>
    <circle cx="795" cy="213" r="20" fill="#60b515" stroke="#60b515"/>
    <path d="m785 213 7 7 14-15" stroke="#fff"/>
  </g>
  <text x="795" y="302" text-anchor="middle" font-size="25" font-weight="700">Можно вставлять</text>
  <text class="small" x="795" y="336">Удалённая Windows</text>

  <g fill="none" stroke="#326b08" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="480" cy="181" r="21" fill="#eaf4e1"/>
    <path d="M480 160v-9m-8 0h16m10 14 6-6m-24 11v13l9 5"/>
  </g>
  <text class="time" x="480" y="249">&#x2248;15 секунд</text>
  <path d="M320 283h313" fill="none" stroke="#60b515" stroke-width="7" stroke-linecap="round"/>
  <path d="m626 269 25 14-25 14z" fill="#60b515"/>
  <text class="small" x="480" y="325">Через видео камеры</text>

  <text x="480" y="399" text-anchor="middle" font-size="22" fill="#326b08">1080p &#xB7; 4 цвета &#xB7; 0,557 Мбит/с</text>
  <text x="480" y="433" text-anchor="middle" font-size="18" fill="#4b6044">Пример скорости. Подготовка и подтверждение могут увеличить время.</text>
</svg>
