<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="690" viewBox="0 0 1320 690" role="img" aria-labelledby="title desc">
  <title id="title">Get Copy-Paste Back: возможные независимые аудиомаршруты, нереализованная идея</title>
  <desc id="desc">Возможная будущая схема использует виртуальные аудиодрайверы на обоих ПК для нескольких маршрутов модемов через Horizon. Независимость маршрутов не подтверждена. Horizon может смешать выходы в один поток: сначала нужны измерения. Сейчас Client.exe отправляет через один выход, Server.exe слушает все локальные выходы или один выбранный. Независимые каналы Horizon не реализованы, роста скорости схема не обещает.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#697c91"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b44; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #4a6078; }
      .heading { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .label { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .small { font-size: 16px; text-anchor: middle; fill: #405971; }
      .route { fill: none; stroke: #697c91; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1320" height="690" rx="18" fill="#fff"/>
  <rect x="26" y="24" width="1268" height="53" rx="12" fill="#fff1d8" stroke="#dfbf7b"/>
  <text x="48" y="58" class="title">Get Copy-Paste Back · Будущие каналы · НЕ РЕАЛИЗОВАНО</text>
  <text x="38" y="111" class="subtitle">Сохранит ли Horizon независимость нескольких маршрутов модема? Это ещё нужно проверить.</text>

  <rect x="30" y="142" width="350" height="373" rx="14" fill="#f2f6fc" stroke="#cbd9e9"/>
  <text x="205" y="177" class="heading">Удалённый рабочий стол</text>
  <text x="205" y="204" class="small">Возможный виртуальный аудиодрайвер</text>
  <rect x="55" y="225" width="300" height="67" rx="10" fill="#fff" stroke="#aabbd0" stroke-dasharray="6 4"/>
  <text x="205" y="252" class="label">Виртуальный выход A</text><text x="205" y="275" class="small">Поток модема A</text>
  <rect x="55" y="315" width="300" height="67" rx="10" fill="#fff" stroke="#aabbd0" stroke-dasharray="6 4"/>
  <text x="205" y="342" class="label">Виртуальный выход B</text><text x="205" y="365" class="small">Поток модема B</text>
  <rect x="55" y="405" width="300" height="67" rx="10" fill="#fff" stroke="#aabbd0" stroke-dasharray="6 4"/>
  <text x="205" y="432" class="label">Виртуальный выход C</text><text x="205" y="455" class="small">Поток модема C</text>

  <rect x="450" y="142" width="420" height="373" rx="14" fill="#fff8e9" stroke="#dfc98e"/>
  <text x="660" y="177" class="heading">Перенаправление Horizon</text>
  <text x="660" y="204" class="small">Независимость не подтверждена</text>
  <text x="660" y="255" class="label">Канал A сохранится?</text>
  <text x="660" y="345" class="label">Канал B сохранится?</text>
  <text x="660" y="435" class="label">Канал C сохранится?</text>
  <text x="660" y="487" class="small">Horizon может смешать выходы в один поток.</text>

  <rect x="940" y="142" width="350" height="373" rx="14" fill="#f1f8f5" stroke="#c4dfd1"/>
  <text x="1115" y="177" class="heading">Локальный ПК</text>
  <text x="1115" y="204" class="small">Возможный виртуальный аудиодрайвер</text>
  <rect x="965" y="225" width="300" height="67" rx="10" fill="#fff" stroke="#9fbfb0" stroke-dasharray="6 4"/>
  <text x="1115" y="252" class="label">Виртуальный вход A</text><text x="1115" y="275" class="small">Независимый декодер A?</text>
  <rect x="965" y="315" width="300" height="67" rx="10" fill="#fff" stroke="#9fbfb0" stroke-dasharray="6 4"/>
  <text x="1115" y="342" class="label">Виртуальный вход B</text><text x="1115" y="365" class="small">Независимый декодер B?</text>
  <rect x="965" y="405" width="300" height="67" rx="10" fill="#fff" stroke="#9fbfb0" stroke-dasharray="6 4"/>
  <text x="1115" y="432" class="label">Виртуальный вход C</text><text x="1115" y="455" class="small">Независимый декодер C?</text>

  <path d="M356 258 H475" class="route"/><path d="M845 258 H956" class="route"/>
  <path d="M356 348 H475" class="route"/><path d="M845 348 H956" class="route"/>
  <path d="M356 438 H475" class="route"/><path d="M845 438 H956" class="route"/>

  <rect x="30" y="540" width="1260" height="123" rx="14" fill="#f6f8fb" stroke="#d6dfe9"/>
  <text x="50" y="573" font-size="19" font-weight="700">Сейчас: Client.exe отправляет через один выход; Server.exe слушает все локальные выходы или один выбранный.</text>
  <text x="50" y="605" font-size="17">До реализации нужны проверки независимости, смешивания, помех, соответствия устройств и скорости передачи.</text>
  <text x="50" y="635" font-size="17" font-weight="700">Больше виртуальных устройств не означает больше независимых каналов Horizon. Линейный рост скорости не обещается.</text>
</svg>
